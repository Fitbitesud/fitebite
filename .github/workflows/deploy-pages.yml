name: Deploy to GitHub Pages

on:
  push:
    branches: [main, arena/43929ce2-fitebite]
  workflow_dispatch:
  # بناء يومي تلقائي لالتقاط تعديلات لوحة تحكم Sanity بدون دفع commit
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # الدومين المخصص fitbite-sudan.com يُقدَّم من جذر الموقع (/) وليس من
      # مسار فرعي، لذلك يُبنى الموقع بدون basePath إطلاقاً. البناء القديم
      # بـ basePath=/fitebite كان يجعل الصفحات تطلب CSS/JS من
      # /fitebite/_next/... فتعود 404 على الدومين الجديد ويظهر الموقع
      # كنصوص عارية بلا ألوان أو أشكال.
      # ملف public/CNAME يُنسخ تلقائياً إلى out/CNAME فيحفظ ربط الدومين
      # المخصص (وشهادة HTTPS التلقائية من GitHub) مع كل نشر.
      - name: Build static export (custom domain — served from root, no basePath)
        run: npm run build
        env:
          SITE_URL: https://fitbite-sudan.com/
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.SANITY_API_VERSION }}
          NEXT_PUBLIC_SANITY_COMMENT_TOKEN: ${{ secrets.SANITY_COMMENT_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
